function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

let particles=null, bokeh=null;
function build(){
  const rnd=mulberry32(20260907);
  particles=[];
  for(let i=0;i<150;i++){
    const cyan=rnd()<0.45;
    particles.push({
      x:rnd(), y:rnd(),
      r:(0.0009+rnd()*0.0022),      // frac of W
      cyan:cyan,
      spark:rnd()<0.22,
      k:1+Math.floor(rnd()*3),       // integer cycles -> seamless
      ph:rnd()*Math.PI*2,
      base:0.35+rnd()*0.5
    });
  }
  // bokeh glints (enhance the baked bokeh). left=amber, right=blue
  bokeh=[];
  const L=[[0.05,0.32],[0.10,0.62],[0.16,0.30],[0.04,0.78],[0.20,0.70],[0.12,0.16]];
  const R=[[0.88,0.34],[0.94,0.58],[0.83,0.72],[0.90,0.20],[0.78,0.50]];
  L.forEach((p,i)=>bokeh.push({x:p[0],y:p[1],r:0.02+ (i%3)*0.012, amber:true, k:1+(i%2), ph:rnd()*6.28, base:0.10+0.06*rnd(), fy:0.010+0.01*rnd(), fk:1+(i%2)}));
  R.forEach((p,i)=>bokeh.push({x:p[0],y:p[1],r:0.018+(i%3)*0.012, amber:false,k:1+(i%2), ph:rnd()*6.28, base:0.08+0.05*rnd(), fy:0.010+0.01*rnd(), fk:1+(i%2)}));
}

function resize(){
  W=cv.width=window.innerWidth; H=cv.height=window.innerHeight;
  tmp=document.createElement('canvas'); tmp.width=W; tmp.height=H; tctx=tmp.getContext('2d');
  if(!particles) build();
}
window.addEventListener('resize',resize);

function starPath(c,cx,cy,oR,iR,rot){
  c.beginPath();
  for(let i=0;i<10;i++){
    const r=(i%2===0)?oR:iR;
    const a=rot - Math.PI/2 + i*Math.PI/5;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    if(i===0)c.moveTo(x,y); else c.lineTo(x,y);
  }
  c.closePath();
}

function drawFrame(t){
  const ph=(t%T)/T;               // 0..1
  const cx=STAR_CX*W, cy=STAR_CY*H;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#03091e"; ctx.fillRect(0,0,W,H);

  // 1) baked art, gentle breathing zoom (>=1 so no borders)
  const zoom=1.0+0.022*(0.5-0.5*Math.cos(ph*2*Math.PI));
  const dw=W*zoom, dh=H*zoom;
  ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh);

  // 2) rotating conic light sweeps along the swirl band -> flowing clockwise energy
  const ang=ph*2*Math.PI;         // one full turn per loop = seamless
  tctx.clearRect(0,0,W,H);
  let g=tctx.createConicGradient(ang,cx,cy);
  g.addColorStop(0.00,"rgba(0,229,255,0.0)");
  g.addColorStop(0.06,"rgba(120,240,255,0.55)");
  g.addColorStop(0.12,"rgba(0,229,255,0.0)");
  g.addColorStop(0.50,"rgba(0,0,0,0)");
  g.addColorStop(0.56,"rgba(240,205,120,0.32)");
  g.addColorStop(0.62,"rgba(0,0,0,0)");
  g.addColorStop(1.00,"rgba(0,0,0,0)");
  tctx.fillStyle=g; tctx.fillRect(0,0,W,H);
  // mask to an annulus around the centre (hole over star, fade at far edge)
  const rin=0.19*W, rout=0.95*W;
  let m=tctx.createRadialGradient(cx,cy,rin*0.6,cx,cy,rout);
  m.addColorStop(0,"rgba(0,0,0,0)");
  m.addColorStop(0.16,"rgba(0,0,0,1)");
  m.addColorStop(0.75,"rgba(0,0,0,1)");
  m.addColorStop(1,"rgba(0,0,0,0)");
  tctx.globalCompositeOperation='destination-in'; tctx.fillStyle=m; tctx.fillRect(0,0,W,H);
  tctx.globalCompositeOperation='source-over';
  ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.9;
  ctx.drawImage(tmp,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

  // 3) bokeh glints
  ctx.globalCompositeOperation='screen';
  for(const b of bokeh){
    const puls=b.base*(0.55+0.45*Math.sin(ph*2*Math.PI*b.k + b.ph));
    const yy=(b.y + b.fy*Math.sin(ph*2*Math.PI*b.fk + b.ph))*H;
    const xx=b.x*W, rr=b.r*W;
    const gg=ctx.createRadialGradient(xx,yy,0,xx,yy,rr);
    const col=b.amber?"255,176,80":"90,170,255";
    gg.addColorStop(0,"rgba("+col+","+puls.toFixed(3)+")");
    gg.addColorStop(1,"rgba("+col+",0)");
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(xx,yy,rr,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  // 4) twinkling particles
  ctx.globalCompositeOperation='screen';
  for(const p of particles){
    const tw=p.base*(0.30+0.70*Math.abs(Math.sin(ph*2*Math.PI*p.k+p.ph)));
    const x=p.x*W,y=p.y*H,r=p.r*W;
    const col=p.cyan?"170,240,255":"255,255,255";
    if(p.spark){
      ctx.strokeStyle="rgba("+col+","+tw.toFixed(3)+")";
      ctx.lineWidth=Math.max(1,r*0.5); ctx.lineCap='round';
      const L=r*4.2;
      ctx.beginPath();ctx.moveTo(x-L,y);ctx.lineTo(x+L,y);ctx.moveTo(x,y-L);ctx.lineTo(x,y+L);ctx.stroke();
      const gg=ctx.createRadialGradient(x,y,0,x,y,r*1.6);
      gg.addColorStop(0,"rgba("+col+","+tw.toFixed(3)+")");gg.addColorStop(1,"rgba("+col+",0)");
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,r*1.6,0,6.2832);ctx.fill();
    } else {
      const gg=ctx.createRadialGradient(x,y,0,x,y,r*2.2);
      gg.addColorStop(0,"rgba("+col+","+tw.toFixed(3)+")");
      gg.addColorStop(0.5,"rgba("+col+","+(tw*0.4).toFixed(3)+")");
      gg.addColorStop(1,"rgba("+col+",0)");
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,r*2.2,0,6.2832);ctx.fill();
    }
  }
  ctx.globalCompositeOperation='source-over';

  // ---- CENTRE PIECE ----
  const oR=0.150*W, iR=oR*0.40, ringR=0.163*W;

  // 5.0) erase baked star + baked ring inside the circle so only the new
  //      spinning star shows (deep-blue disk matching the ring interior)
  let dg=ctx.createRadialGradient(cx,cy,0,cx,cy,ringR*1.05);
  dg.addColorStop(0,"#0c2050");
  dg.addColorStop(0.72,"#0a1a3e");
  dg.addColorStop(0.9,"#0a1836");
  dg.addColorStop(1,"rgba(10,24,54,0)");
  ctx.fillStyle=dg; ctx.beginPath(); ctx.arc(cx,cy,ringR*1.05,0,6.2832); ctx.fill();

  // 5a) central halo (breathing) to seat the star
  const halo=0.6+0.4*(0.5-0.5*Math.cos(ph*2*Math.PI*2));
  ctx.globalCompositeOperation='screen';
  let hg=ctx.createRadialGradient(cx,cy,oR*0.2,cx,cy,ringR*1.7);
  hg.addColorStop(0,"rgba(255,236,180,"+(0.30*halo).toFixed(3)+")");
  hg.addColorStop(0.5,"rgba(120,200,255,"+(0.12*halo).toFixed(3)+")");
  hg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(cx,cy,ringR*1.7,0,6.2832); ctx.fill();
  ctx.globalCompositeOperation='source-over';

  // 5b) spinning star (5-fold symmetry -> 72deg per loop is seamless; slow)
  const rot=ph*(2*Math.PI/5);
  // soft bloom under star
  ctx.globalCompositeOperation='screen';
  let bl=ctx.createRadialGradient(cx,cy,0,cx,cy,oR*1.25);
  bl.addColorStop(0,"rgba(255,255,255,0.55)");
  bl.addColorStop(0.4,"rgba(255,246,214,0.28)");
  bl.addColorStop(1,"rgba(255,240,200,0)");
  ctx.fillStyle=bl; ctx.beginPath(); ctx.arc(cx,cy,oR*1.25,0,6.2832); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  // star body
  ctx.save();
  ctx.shadowColor="rgba(255,224,150,0.9)"; ctx.shadowBlur=oR*0.28;
  starPath(ctx,cx,cy,oR,iR,rot);
  let sg=ctx.createRadialGradient(cx,cy,0,cx,cy,oR);
  sg.addColorStop(0,"#ffffff");
  sg.addColorStop(0.45,"#fffdf2");
  sg.addColorStop(0.72,"#f6e2a4");
  sg.addColorStop(1,"#d9b357");
  ctx.fillStyle=sg; ctx.fill();
  ctx.restore();

  // 5c) gold ring with a travelling light arc
  ctx.save();
  ctx.lineWidth=Math.max(2,0.0055*W);
  ctx.strokeStyle="rgba(226,190,110,0.9)";
  ctx.shadowColor="rgba(240,205,120,0.9)"; ctx.shadowBlur=0.02*W;
  ctx.beginPath(); ctx.arc(cx,cy,ringR,0,6.2832); ctx.stroke();
  // travelling bright arc
  const a0=ang, a1=ang+Math.PI*0.28;
  ctx.lineWidth=Math.max(2,0.0075*W); ctx.lineCap='round';
  ctx.strokeStyle="rgba(255,246,220,0.95)"; ctx.shadowBlur=0.03*W; ctx.shadowColor="rgba(255,236,170,1)";
  ctx.beginPath(); ctx.arc(cx,cy,ringR,a0,a1); ctx.stroke();
  ctx.restore();

  // 6) RBC logo dead-centre on the star
  const lw=0.060*W, lh=lw*(logo.height/logo.width);
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.55)"; ctx.shadowBlur=0.012*W; ctx.shadowOffsetY=0.004*W;
  ctx.drawImage(logo, LOGO_CX*W-lw/2, LOGO_CY*H-lh/2, lw, lh);
  ctx.restore();

  // 7) title
  const glow=0.65+0.35*(0.5-0.5*Math.cos(ph*2*Math.PI*2));
  const s1=0.072*H, s2=0.096*H;
  const y1=0.795*H, y2=0.905*H;
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  // line 1
  ctx.save();
  ctx.font="600 "+s1+"px 'Poppins SemiBold','Poppins',sans-serif";
  ctx.shadowColor="rgba(0,0,0,0.55)"; ctx.shadowBlur=0.018*W; ctx.shadowOffsetY=0.004*H;
  ctx.fillStyle="rgba(89,200,255,"+(0.9*glow).toFixed(3)+")"; // cyan glow pass
  ctx.fillText("RBC Performance Gala",W/2,y1);
  ctx.shadowColor="rgba(89,200,255,"+(0.8*glow).toFixed(3)+")"; ctx.shadowBlur=0.03*W; ctx.shadowOffsetY=0;
  ctx.fillStyle="#FFFFF4";
  ctx.fillText("RBC Performance Gala",W/2,y1);
  ctx.restore();
  // line 2 (bold, larger)
  ctx.save();
  ctx.font="700 "+s2+"px 'Poppins','Poppins Bold',sans-serif";
  ctx.shadowColor="rgba(0,0,0,0.55)"; ctx.shadowBlur=0.018*W; ctx.shadowOffsetY=0.004*H;
  ctx.fillStyle="rgba(89,200,255,"+(0.9*glow).toFixed(3)+")";
  ctx.fillText("2026",W/2,y2);
  ctx.shadowColor="rgba(120,210,255,"+(0.9*glow).toFixed(3)+")"; ctx.shadowBlur=0.035*W; ctx.shadowOffsetY=0;
  ctx.fillStyle="#FFFFF4";
  ctx.fillText("2026",W/2,y2);
  ctx.restore();
}

window.renderAt=function(t){ if(!W)resize(); drawFrame(t); return true; };
window.assetsReady=function(){ return ready>=2 && document.fonts.check("600 40px 'Poppins SemiBold'"); };
resize();
</script>
</body></html>
