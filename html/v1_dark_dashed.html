<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBC Performance Gala 2026 — V1 (dark / dashed)</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:#03091e;
  font-family: Georgia, 'Times New Roman', serif;
}

canvas {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  z-index:0;
}

#ui {
  position:fixed; inset:0;
  z-index:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:5vh;
  pointer-events:none;
}

/* ── Star assembly ─────────────────────────── */
#star-wrap {
  position:relative;
  width: clamp(180px, 28vw, 300px);
  height:clamp(180px, 28vw, 300px);
  flex-shrink:0;
}

#golden-ring {
  position:absolute; inset:0;
  border-radius:50%;
  border:2.5px solid rgba(212,175,55,.90);
  box-shadow:
    0 0 14px 3px  rgba(212,175,55,.80),
    0 0 38px 6px  rgba(212,175,55,.38),
    0 0 75px 10px rgba(212,175,55,.16),
    inset 0 0 16px 3px rgba(212,175,55,.22);
  animation:ring-breathe 5s ease-in-out infinite;
}
@keyframes ring-breathe {
  0%,100% {
    box-shadow:
      0 0 14px 3px  rgba(212,175,55,.80),
      0 0 38px 6px  rgba(212,175,55,.38),
      0 0 75px 10px rgba(212,175,55,.16),
      inset 0 0 16px 3px rgba(212,175,55,.22);
  }
  50% {
    box-shadow:
      0 0 24px 5px  rgba(212,175,55,1),
      0 0 60px 10px rgba(212,175,55,.65),
      0 0 110px 15px rgba(212,175,55,.28),
      inset 0 0 24px 5px rgba(212,175,55,.38);
  }
}

#star-svg {
  position:absolute;
  width:80%; height:80%;
  top:10%; left:10%;
  animation:star-spin 28s linear infinite;
  filter:
    drop-shadow(0 0 7px rgba(255,255,220,.98))
    drop-shadow(0 0 20px rgba(212,175,55,.85))
    drop-shadow(0 0 45px rgba(255,200,50,.50));
}
@keyframes star-spin { to { transform:rotate(360deg); } }

/* Logo stays static (not a child of the spinning SVG) */
#logo {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
}
#logo svg {
  width:clamp(40px,5.2vw,60px);
  height:auto;
  filter:drop-shadow(0 0 7px rgba(90,150,255,.55));
}

/* ── Title ─────────────────────────────────── */
#title { text-align:center; line-height:1.22; }

.t1 {
  display:block;
  font-size:clamp(17px,3.1vw,50px);
  font-weight:400;
  color:#fff;
  letter-spacing:.09em;
  animation:text-glow 6s ease-in-out infinite;
}
.t2 {
  display:block;
  font-size:clamp(24px,4.6vw,68px);
  font-weight:700;
  color:#fff;
  letter-spacing:.18em;
  animation:text-glow 6s ease-in-out infinite;
  animation-delay:.75s;
}
@keyframes text-glow {
  0%,100% { text-shadow:0 0 28px rgba(60,140,255,.80), 0 0 65px rgba(60,140,255,.32); }
  50%     { text-shadow:0 0 44px rgba(60,140,255,1),   0 0 90px rgba(60,140,255,.56), 0 0 135px rgba(60,140,255,.22); }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">

  <!-- Star assembly: ring + spinning star + static logo -->
  <div id="star-wrap">
    <div id="golden-ring"></div>

    <!-- 5-point star (spins) -->
    <svg id="star-svg" viewBox="-120 -120 240 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- White-to-gold radial gradient -->
        <radialGradient id="sg" cx="50%" cy="32%" r="68%">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="28%"  stop-color="#f8f0de"/>
          <stop offset="58%"  stop-color="#d4af37"/>
          <stop offset="80%"  stop-color="#9a7012"/>
          <stop offset="100%" stop-color="#5a3e08"/>
        </radialGradient>
        <!-- Soft glow filter -->
        <filter id="gf" x="-35%" y="-35%" width="170%" height="170%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Navy shadow star (slightly larger, behind) -->
      <polygon
        points="0,-108 25.2,-35.1 101.9,-33.8 40.7,13.7 63.0,87.0 0,43.5 -63.0,87.0 -40.7,13.7 -101.9,-33.8 -25.2,-35.1"
        fill="#0b1c74" opacity="0.55"/>
      <!-- Main white/gold star -->
      <polygon
        points="0,-100 23.5,-32.4 95.1,-30.9 38.0,12.4 58.8,80.9 0,40.0 -58.8,80.9 -38.0,12.4 -95.1,-30.9 -23.5,-32.4"
        fill="url(#sg)" filter="url(#gf)"/>
    </svg>

    <!-- RBC logo — stays centred / not rotating -->
    <div id="logo">
      <svg viewBox="0 0 56 70" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="shg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#1e40a8"/>
            <stop offset="100%" stop-color="#0a1e72"/>
          </linearGradient>
        </defs>
        <!-- Heraldic shield -->
        <path d="M3,3 L53,3 L53,40 Q53,64 28,68 Q3,64 3,40 Z"
          fill="url(#shg)" stroke="#d4af37" stroke-width="2.2"/>
        <!-- Stylised globe (circle + meridians + equator) -->
        <circle cx="28" cy="26" r="14" fill="none" stroke="#8ab8ff" stroke-width="1.6"/>
        <ellipse cx="28" cy="26" rx="7" ry="14" fill="none" stroke="#8ab8ff" stroke-width="1.1"/>
        <line x1="14" y1="26" x2="42" y2="26" stroke="#8ab8ff" stroke-width="1.1"/>
        <line x1="15" y1="20" x2="41" y2="20" stroke="#8ab8ff" stroke-width="0.75" opacity="0.85"/>
        <line x1="15" y1="32" x2="41" y2="32" stroke="#8ab8ff" stroke-width="0.75" opacity="0.85"/>
        <!-- RBC wordmark -->
        <text x="28" y="54.5" text-anchor="middle"
          font-family="'Arial Black',Arial,sans-serif" font-weight="900"
          font-size="10.5" letter-spacing="2.3" fill="#d4af37">RBC</text>
      </svg>
    </div>
  </div>

  <!-- Title -->
  <div id="title">
    <span class="t1">RBC Performance Gala</span>
    <span class="t2">2026</span>
  </div>

</div><!-- #ui -->

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const wrap   = document.getElementById('star-wrap');

  /* ── State ──────────────────────────────────────────── */
  let W, H, CX, CY, ringRadius;

  function layout () {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const r  = wrap.getBoundingClientRect();
    CX       = r.left + r.width  / 2;
    CY       = r.top  + r.height / 2;
    ringRadius = r.width / 2;
  }

  /* ── Particles / sparks ─────────────────────────────── */
  const N_PART = 175;
  let parts = [];

  function mkPart () {
    const rng = Math.random();
    return {
      x:  Math.random() * (W  || window.innerWidth),
      y:  Math.random() * (H  || window.innerHeight),
      sz: Math.random() * 2.1 + 0.35,
      ba: Math.random() * 0.62 + 0.20,
      ph: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.024 + 0.007,
      col: rng < .54 ? '#ffffff'
         : rng < .76 ? '#aaddff'
         : rng < .90 ? '#ffe88a'
         :              '#ff9e30',
      spark: Math.random() < 0.17,
    };
  }

  function initParts () { parts = Array.from({ length: N_PART }, mkPart); }

  function drawPart (p, t) {
    const a = p.ba * (0.28 + 0.72 * Math.abs(Math.sin(p.ph + t * p.sp)));
    if (a < 0.02) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle   = p.col;
    ctx.shadowColor = p.col;
    if (p.spark) {
      const s = p.sz * 4.0, sf = s * 0.26;
      ctx.shadowBlur = s * 3.5;
      ctx.beginPath();
      ctx.moveTo(p.x,     p.y - s );
      ctx.lineTo(p.x + sf, p.y - sf);
      ctx.lineTo(p.x + s,  p.y    );
      ctx.lineTo(p.x + sf, p.y + sf);
      ctx.lineTo(p.x,     p.y + s );
      ctx.lineTo(p.x - sf, p.y + sf);
      ctx.lineTo(p.x - s,  p.y    );
      ctx.lineTo(p.x - sf, p.y - sf);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.shadowBlur = p.sz * 5.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ── Bokeh blobs ────────────────────────────────────── */
  const BOKEH = [
    // Orange/amber — left
    { xf:.035, yf:.52, r: 95, rgb:[255,100,  0], a:.34 },
    { xf:.065, yf:.68, r: 66, rgb:[255,132, 15], a:.27 },
    { xf:.015, yf:.38, r: 52, rgb:[200, 75,  0], a:.21 },
    { xf:.130, yf:.78, r: 72, rgb:[178, 88, 14], a:.20 },
    { xf:.045, yf:.26, r: 42, rgb:[255,148, 30], a:.17 },
    // Blue — right
    { xf:.93,  yf:.18, r: 52, rgb:[ 20, 80,205], a:.25 },
    { xf:.965, yf:.47, r: 60, rgb:[ 10, 60,192], a:.22 },
    { xf:.880, yf:.63, r: 42, rgb:[ 15, 70,200], a:.18 },
  ];

  function drawBokeh (t) {
    const sc = H / 750;
    BOKEH.forEach((b, i) => {
      const x = b.xf * W, y = b.yf * H;
      const pulse = 1 + 0.07 * Math.sin(t * 0.0007 + i * 1.68);
      const r = b.r * pulse * sc;
      const [cr,cg,cb] = b.rgb;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0,    `rgba(${cr},${cg},${cb},.88)`);
      g.addColorStop(0.35, `rgba(${cr},${cg},${cb},.42)`);
      g.addColorStop(0.70, `rgba(${cr},${cg},${cb},.10)`);
      g.addColorStop(1,    `rgba(${cr},${cg},${cb}, 0)`);
      ctx.save();
      ctx.globalAlpha = b.a;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  /* ── Background + nebula ────────────────────────────── */
  const NEBULAE = [
    { xf:.50, yf:.32, rf:.44, rgb:[ 15, 44,128], a:.92 },
    { xf:.34, yf:.54, rf:.33, rgb:[ 10, 32,108], a:.62 },
    { xf:.70, yf:.60, rf:.27, rgb:[ 12, 38,118], a:.52 },
    { xf:.18, yf:.36, rf:.28, rgb:[ 30, 12,102], a:.52 },
    { xf:.82, yf:.24, rf:.23, rgb:[ 10, 28,130], a:.42 },
    { xf:.60, yf:.72, rf:.25, rgb:[  8, 24, 98], a:.36 },
    { xf:.42, yf:.14, rf:.20, rgb:[  8, 20,110], a:.35 },
  ];

  function drawBackground (t) {
    ctx.fillStyle = '#03091e';
    ctx.fillRect(0, 0, W, H);
    const s = Math.max(W, H);
    NEBULAE.forEach((n, i) => {
      const x = n.xf * W, y = n.yf * H;
      const pulse = 1 + 0.04 * Math.sin(t * 0.00042 + i * 2.18);
      const r = n.rf * s * pulse;
      const [cr,cg,cb] = n.rgb;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0,   `rgba(${cr},${cg},${cb},${n.a})`);
      g.addColorStop(0.52,`rgba(${cr},${cg},${cb},${+(n.a * 0.38).toFixed(2)})`);
      g.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
      ctx.save();
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  /* ── Central glow (canvas layer behind the CSS star) ── */
  function drawStarGlow (t) {
    const pulse = 1 + 0.09 * Math.sin(t * 0.00102);
    const r = ringRadius * 4.5 * pulse;
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, r);
    g.addColorStop(0,    'rgba(255,240,168,.15)');
    g.addColorStop(0.22, 'rgba(212,175, 55,.08)');
    g.addColorStop(0.50, 'rgba( 70,155,255,.05)');
    g.addColorStop(1,    'rgba(  0,  0,  0, 0)');
    ctx.save();
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* ── Swirl arms ─────────────────────────────────────── */
  const SWIRLS = [
    // Bright cyan arms
    { base:-0.35, sw:1.72*Math.PI, Ro:.90, col:'#00e5ff', glo:'#00bfff', w:2.0, a:.78 },
    { base: 0.55, sw:1.62*Math.PI, Ro:.83, col:'#4fc3f7', glo:'#0288d1', w:1.6, a:.66 },
    { base: 1.30, sw:1.56*Math.PI, Ro:.79, col:'#00e5ff', glo:'#00bfff', w:1.8, a:.62 },
    { base: 2.10, sw:1.62*Math.PI, Ro:.82, col:'#29b6f6', glo:'#01579b', w:1.2, a:.52 },
    { base: 2.90, sw:1.46*Math.PI, Ro:.74, col:'#4fc3f7', glo:'#0288d1', w:1.0, a:.44 },
    { base: 3.70, sw:1.36*Math.PI, Ro:.68, col:'#00e5ff', glo:'#00bfff', w:0.8, a:.38 },
    // Gold arms
    { base: 4.60, sw:1.30*Math.PI, Ro:.76, col:'#d4af37', glo:'#ffd700', w:1.5, a:.64 },
    { base: 5.40, sw:1.20*Math.PI, Ro:.68, col:'#c8a000', glo:'#d4af37', w:1.0, a:.50 },
    { base: 0.20, sw:1.14*Math.PI, Ro:.62, col:'#ffd700', glo:'#ffec6e', w:0.8, a:.42 },
  ];

  const N_SEG = 110;

  function drawSwirls (t) {
    // Outer "reach": distance from star centre to the farthest screen edge × 1.15
    const reach = Math.max(CX, W - CX, CY, H - CY) * 1.15;
    const iR    = ringRadius * 0.94;   // arms end just inside the gold ring
    const ROT   = 0.000112;            // slow clockwise rotation (rad/ms)
    const FLOW  = 0.022;               // dash flow speed (px/ms), toward centre

    const xs = new Float32Array(N_SEG + 1);
    const ys = new Float32Array(N_SEG + 1);

    SWIRLS.forEach(arm => {
      const oR = arm.Ro * reach;

      for (let i = 0; i <= N_SEG; i++) {
        const tt  = i / N_SEG;
        const ang = arm.base + arm.sw * tt + t * ROT;
        // Slightly curved radius decrease (pow < 1 → faster initial drop)
        const r   = oR - (oR - iR) * Math.pow(tt, 0.74);
        xs[i] = CX + r * Math.cos(ang);
        ys[i] = CY + r * Math.sin(ang);
      }

      /* — thin solid base line — */
      ctx.save();
      ctx.globalAlpha = arm.a * 0.28;
      ctx.strokeStyle = arm.col;
      ctx.lineWidth   = arm.w * 0.30;
      ctx.shadowColor = arm.glo;
      ctx.shadowBlur  = 5;
      ctx.lineJoin    = 'round';
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(xs[0], ys[0]);
      for (let i = 1; i <= N_SEG; i++) ctx.lineTo(xs[i], ys[i]);
      ctx.stroke();
      ctx.restore();

      /* — bright flowing dashes moving inward — */
      ctx.save();
      ctx.globalAlpha = arm.a;
      ctx.strokeStyle = arm.col;
      ctx.lineWidth   = arm.w;
      ctx.shadowColor = arm.glo;
      ctx.shadowBlur  = 22;
      ctx.lineJoin    = 'round';
      ctx.setLineDash([38, 26]);
      // Negative offset → dashes appear to travel toward inner (star centre)
      ctx.lineDashOffset = -(t * FLOW) % 64;
      ctx.beginPath(); ctx.moveTo(xs[0], ys[0]);
      for (let i = 1; i <= N_SEG; i++) ctx.lineTo(xs[i], ys[i]);
      ctx.stroke();
      ctx.restore();
    });

    ctx.setLineDash([]); // reset dash
  }

  /* ── Main animation loop ────────────────────────────── */
  let t0 = null;

  function frame (ts) {
    if (!t0) t0 = ts;
    const t = ts - t0;

    drawBackground(t);
    drawBokeh(t);
    drawStarGlow(t);
    drawSwirls(t);
    parts.forEach(p => drawPart(p, t));

    requestAnimationFrame(frame);
  }

  /* ── Boot (after layout paint) ──────────────────────── */
  requestAnimationFrame(() => {
    layout();
    initParts();

    window.addEventListener('resize', () => {
      requestAnimationFrame(() => { layout(); initParts(); });
    });

    requestAnimationFrame(frame);
  });

})();
</script>
</body>
</html>
