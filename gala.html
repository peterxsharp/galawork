<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#02060f;overflow:hidden}#c{display:block;position:fixed;inset:0}</style>
</head><body><canvas id="c"></canvas>
<script>
const T=12.0;                       // loop length
const LOGO_SRC="__LOGO__";
const CX=0.5, CY=0.40;             // composition centre (star)
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,tmp,tctx;
let logo=new Image(), ready=0; logo.onload=()=>ready++; logo.src=LOGO_SRC;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ss=(e)=>{e=Math.max(0,Math.min(1,e));return e*e*(3-2*e);};      // smoothstep
function win(t,a,b,c,d){ // fade-in a->b, hold, fade-out c->d
  if(t<a)return 0; if(t<b)return ss((t-a)/(b-a)); if(t<c)return 1;
  if(t<d)return 1-ss((t-c)/(d-c)); return 0;
}
function keys(t,K){ // linear interp keyframes [[time,val]...]
  if(t<=K[0][0])return K[0][1];
  for(let i=1;i<K.length;i++){if(t<=K[i][0]){const[t0,v0]=K[i-1],[t1,v1]=K[i];return v0+(v1-v0)*(t-t0)/(t1-t0);}}
  return K[K.length-1][1];
}

let ribbons,amber,cobalt,motes,embers,built=false;
function build(){
  const r=mulberry32(20260907);
  // sweeping ribbons: quadratic curves in fraction coords {p0,pc,p1}
  ribbons=[
    {p0:[-0.15,0.30],pc:[0.35,-0.10],p1:[1.15,0.34],col:[0,229,255],  w:0.018,delay:3.0,sweep:2.2,rotA:0.05,rotk:1,head:1},
    {p0:[-0.15,0.66],pc:[0.45,1.08],p1:[1.15,0.60],col:[79,195,247], w:0.015,delay:3.5,sweep:2.4,rotA:0.045,rotk:1,head:1},
    {p0:[-0.12,0.86],pc:[0.55,0.30],p1:[1.12,0.14],col:[41,182,246], w:0.013,delay:4.2,sweep:2.6,rotA:0.055,rotk:1,head:1},
    {p0:[-0.12,0.12],pc:[0.50,0.72],p1:[1.12,0.82],col:[212,175,55], w:0.011,delay:4.8,sweep:2.8,rotA:0.04,rotk:1,head:0},
    {p0:[-0.10,0.52],pc:[0.60,-0.05],p1:[1.10,0.46],col:[255,224,96],w:0.009,delay:5.2,sweep:2.8,rotA:0.05,rotk:1,head:0},
  ];
  amber=[{x:0.10,y:0.34,r:0.075,ph:0.0},{x:0.05,y:0.62,r:0.095,ph:0.9},{x:0.19,y:0.78,r:0.065,ph:1.8}];
  cobalt=[{x:0.90,y:0.40,r:0.085,ph:0.5},{x:0.83,y:0.70,r:0.070,ph:1.4}];
  motes=[]; for(let i=0;i<130;i++)motes.push({x:r(),y:r(),s:0.0008+r()*0.0016,cyan:r()<0.5,k:1+((r()*3)|0),ph:r()*6.28,sp:r()<0.18,base:0.4+r()*0.5});
  embers=[]; for(let i=0;i<46;i++)embers.push({x:0.30+r()*0.40,drift:(r()-0.5)*0.10,s:0.0010+r()*0.0018,ph:r(),cyc:1,life:0.55+r()*0.45});
  built=true;
}
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;tctx=tmp.getContext('2d');if(!built)build();}
addEventListener('resize',resize);

function rot(px,py,cx,cy,a){const dx=px-cx,dy=py-cy,c=Math.cos(a),s=Math.sin(a);return[cx+dx*c-dy*s,cy+dx*s+dy*c];}
function qpt(P0,PC,P1,u){const m=1-u;return[m*m*P0[0]+2*m*u*PC[0]+u*u*P1[0], m*m*P0[1]+2*m*u*PC[1]+u*u*P1[1]];}

function starPath(c,cx,cy,oR,iR,rt){c.beginPath();for(let i=0;i<10;i++){const rr=(i%2===0)?oR:iR;const a=rt-Math.PI/2+i*Math.PI/5;const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();}

function drawFrame(t){
  const ph=(t%T);
  const cx=CX*W, cy=CY*H;
  // ---- base navy, depth reveal ----
  const depth=ss(keys(ph,[[0,0.15],[2.0,0.7],[3.0,1.0],[9.5,1.0],[11.2,0.5],[12,0.15]]));
  ctx.fillStyle="#02040c"; ctx.fillRect(0,0,W,H);
  let bgg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.hypot(W,H)*0.62);
  bgg.addColorStop(0,`rgba(16,42,110,${0.55*depth})`);
  bgg.addColorStop(0.45,`rgba(8,22,70,${0.42*depth})`);
  bgg.addColorStop(1,`rgba(2,6,18,${0.9})`);
  ctx.fillStyle=bgg; ctx.fillRect(0,0,W,H);
  // vignette
  let vg=ctx.createRadialGradient(cx,cy,H*0.25,cx,cy,Math.hypot(W,H)*0.6);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.55)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  const rotOsc=Math.sin(ph*2*Math.PI/T); // periodic slow rotation driver

  // ---- ribbons (screen) ----
  ctx.globalCompositeOperation='screen';
  for(const rb of ribbons){
    const app=win(ph,rb.delay,rb.delay+rb.sweep,10.4,12.0);
    if(app<=0.001)continue;
    const prog=ss(Math.min(1,(ph-rb.delay)/rb.sweep)); if(prog<=0)continue;
    const a=rb.rotA*rotOsc;
    const N=64, R=rb.w*W;
    // build rotated sampled points
    const P0=[rb.p0[0]*W,rb.p0[1]*H],PC=[rb.pc[0]*W,rb.pc[1]*H],P1=[rb.p1[0]*W,rb.p1[1]*H];
    const pts=[];
    for(let i=0;i<=N;i++){const u=(i/N)*prog;let p=qpt(P0,PC,P1,u);p=rot(p[0],p[1],cx,cy,a);pts.push(p);}
    // glow passes
    const [cr,cg,cb]=rb.col;
    ctx.lineCap='round'; ctx.lineJoin='round';
    const passes=[[R*2.6,0.12],[R*1.5,0.22],[R*0.8,0.55],[R*0.35,0.95]];
    for(const [lw,al] of passes){
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.lineWidth=lw; ctx.strokeStyle=`rgba(${cr},${cg},${cb},${(al*app).toFixed(3)})`;
      ctx.stroke();
    }
    // bright head glow while sweeping in
    if(prog<1){const hd=pts[pts.length-1];const g=ctx.createRadialGradient(hd[0],hd[1],0,hd[0],hd[1],R*4);
      g.addColorStop(0,`rgba(255,255,255,${0.8*app})`);g.addColorStop(0.4,`rgba(${cr},${cg},${cb},${0.6*app})`);g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(hd[0],hd[1],R*4,0,6.2832);ctx.fill();}
  }
  ctx.globalCompositeOperation='source-over';

  // ---- bokeh orbs (screen) ----
  ctx.globalCompositeOperation='screen';
  const bkEnv=win(ph,4.0,6.0,10.4,12.0);
  function orb(o,col){const puls=0.55+0.45*Math.sin(ph*2*Math.PI/T*1+o.ph);const yy=(o.y+0.012*Math.sin(ph*2*Math.PI/T+o.ph))*H;const xx=o.x*W,rr=o.r*W;const g=ctx.createRadialGradient(xx,yy,0,xx,yy,rr);const a=(0.5*puls*bkEnv);g.addColorStop(0,`rgba(${col},${a.toFixed(3)})`);g.addColorStop(0.5,`rgba(${col},${(a*0.4).toFixed(3)})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(xx,yy,rr,0,6.2832);ctx.fill();}
  for(const o of amber)orb(o,"255,140,0");
  for(const o of cobalt)orb(o,"26,79,214");
  ctx.globalCompositeOperation='source-over';

  // ---- star-motes twinkle (screen) ----
  ctx.globalCompositeOperation='screen';
  const moteEnv=win(ph,3.5,5.0,10.6,12.0);
  for(const m of motes){
    const tw=m.base*(0.3+0.7*Math.abs(Math.sin(ph*2*Math.PI/T*m.k+m.ph)))*moteEnv;
    if(tw<0.01)continue;
    const x=m.x*W,y=m.y*H,r=m.s*W,col=m.cyan?"170,240,255":"255,255,255";
    if(m.sp){ctx.strokeStyle=`rgba(${col},${tw.toFixed(3)})`;ctx.lineWidth=Math.max(1,r*0.5);ctx.lineCap='round';const L=r*4;ctx.beginPath();ctx.moveTo(x-L,y);ctx.lineTo(x+L,y);ctx.moveTo(x,y-L);ctx.lineTo(x,y+L);ctx.stroke();}
    const g=ctx.createRadialGradient(x,y,0,x,y,r*2.4);g.addColorStop(0,`rgba(${col},${tw.toFixed(3)})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.4,0,6.2832);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  // ---- rising gold embers (screen) ----
  ctx.globalCompositeOperation='screen';
  const embEnv=win(ph,3.5,5.5,10.6,12.0);
  for(const e of embers){
    const pr=((ph/T)*e.cyc+e.ph)%1;             // 0..1 periodic
    const y=(0.95-pr*0.9)*H;
    const x=(e.x+e.drift*pr+0.02*Math.sin(pr*8+e.ph))*W;
    const fade=Math.sin(Math.min(1,pr/e.life)*Math.PI); // in/out along rise
    const a=0.7*fade*embEnv; if(a<0.01)continue;
    const r=e.s*W;const g=ctx.createRadialGradient(x,y,0,x,y,r*2.6);
    g.addColorStop(0,`rgba(255,224,140,${a.toFixed(3)})`);g.addColorStop(0.5,`rgba(255,180,60,${(a*0.5).toFixed(3)})`);g.addColorStop(1,`rgba(255,170,40,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.6,0,6.2832);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  // ---- central golden ignition -> bloom -> orb (screen) ----
  const coreR=keys(ph,[[0,0.004],[0.9,0.010],[1.4,0.030],[3.0,0.11],[9.5,0.115],[11.0,0.05],[11.7,0.010],[12,0.004]])*W;
  const coreI=keys(ph,[[0,0.9],[0.9,1.0],[3.0,0.85],[9.5,0.85],[11.5,0.95],[12,0.9]]);
  ctx.globalCompositeOperation='screen';
  let cg=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*2.4);
  cg.addColorStop(0,`rgba(255,252,240,${(0.95*coreI).toFixed(3)})`);
  cg.addColorStop(0.35,`rgba(255,232,170,${(0.7*coreI).toFixed(3)})`);
  cg.addColorStop(0.7,`rgba(255,196,90,${(0.30*coreI).toFixed(3)})`);
  cg.addColorStop(1,"rgba(255,180,60,0)");
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,coreR*2.4,0,6.2832);ctx.fill();
  ctx.globalCompositeOperation='source-over';

  // ---- STAR arrival ----
  const stEnv=ss(win(ph,5.5,7.6,10.9,12.0));
  if(stEnv>0.002){
    const oR=(0.070+0.055*stEnv)*W;             // scales up as it arrives
    const iR=oR*0.40, ringR=oR*1.10;
    const rt=(ph*2*Math.PI/T)*(1/1); // slow single turn per loop -> seamless (fades at seam anyway)
    // deep-blue seat disk so the star reads crisp over the glow
    let dg=ctx.createRadialGradient(cx,cy,0,cx,cy,ringR*1.05);
    dg.addColorStop(0,`rgba(10,26,72,${(0.85*stEnv).toFixed(3)})`);dg.addColorStop(0.8,`rgba(8,20,56,${(0.8*stEnv).toFixed(3)})`);dg.addColorStop(1,"rgba(8,20,56,0)");
    ctx.fillStyle=dg;ctx.beginPath();ctx.arc(cx,cy,ringR*1.05,0,6.2832);ctx.fill();
    // bloom under star
    ctx.globalCompositeOperation='screen';
    let bl=ctx.createRadialGradient(cx,cy,0,cx,cy,oR*1.35);
    bl.addColorStop(0,`rgba(255,255,255,${0.5*stEnv})`);bl.addColorStop(0.45,`rgba(255,244,206,${0.26*stEnv})`);bl.addColorStop(1,"rgba(255,238,200,0)");
    ctx.fillStyle=bl;ctx.beginPath();ctx.arc(cx,cy,oR*1.35,0,6.2832);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    // star body
    ctx.save();ctx.globalAlpha=stEnv;ctx.shadowColor="rgba(255,222,150,0.9)";ctx.shadowBlur=oR*0.28;
    starPath(ctx,cx,cy,oR,iR,rt);
    let sg=ctx.createRadialGradient(cx,cy,0,cx,cy,oR);
    sg.addColorStop(0,"#ffffff");sg.addColorStop(0.45,"#fffdf2");sg.addColorStop(0.72,"#f6e2a4");sg.addColorStop(1,"#d9b357");
    ctx.fillStyle=sg;ctx.fill();ctx.restore();
    // gold ring + travelling arc + breathing glow
    const breath=0.6+0.4*(0.5-0.5*Math.cos(ph*2*Math.PI/T*2));
    ctx.save();ctx.globalAlpha=stEnv;
    ctx.lineWidth=Math.max(2,0.004*W);ctx.strokeStyle=`rgba(226,190,110,${0.9})`;
    ctx.shadowColor=`rgba(240,205,120,${breath})`;ctx.shadowBlur=0.02*W;
    ctx.beginPath();ctx.arc(cx,cy,ringR,0,6.2832);ctx.stroke();
    const a0=ph*2*Math.PI/T*2;ctx.lineWidth=Math.max(2,0.006*W);ctx.lineCap='round';
    ctx.strokeStyle="rgba(255,247,222,0.95)";ctx.shadowBlur=0.03*W;ctx.shadowColor="rgba(255,236,170,1)";
    ctx.beginPath();ctx.arc(cx,cy,ringR,a0,a0+Math.PI*0.3);ctx.stroke();ctx.restore();
    // RBC crest dead-centre
    const lw=0.052*W*(0.6+0.4*stEnv), lh=lw*(logo.height/logo.width);
    ctx.save();ctx.globalAlpha=stEnv;ctx.shadowColor="rgba(0,0,0,0.5)";ctx.shadowBlur=0.010*W;ctx.shadowOffsetY=0.003*W;
    ctx.drawImage(logo,cx-lw/2,cy-lh/2,lw,lh);ctx.restore();
  }

  // ---- title (slow dissolve, last) ----
  const txEnv=ss(win(ph,7.6,9.2,11.0,12.0));
  if(txEnv>0.002){
    const glow=0.6+0.4*(0.5-0.5*Math.cos(ph*2*Math.PI/T*2));
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    const y1=0.80*H,y2=0.905*H,s1=0.058*H,s2=0.082*H;
    // line 1 : cyan glow pass, then crisp white core
    ctx.save();ctx.globalAlpha=txEnv;
    ctx.font=`600 ${s1}px 'Playfair Display',Georgia,serif`;
    ctx.shadowColor=`rgba(89,200,255,${(0.9*glow)})`;ctx.shadowBlur=0.03*W;
    ctx.fillStyle="rgba(120,205,255,0.9)";ctx.fillText("RBC Performance Gala",W/2,y1);
    ctx.shadowBlur=0.006*W;ctx.shadowColor="rgba(0,0,0,0.5)";
    ctx.fillStyle="#FFFFFF";ctx.fillText("RBC Performance Gala",W/2,y1);
    ctx.restore();
    // line 2
    ctx.save();ctx.globalAlpha=txEnv;
    ctx.font=`700 ${s2}px 'Playfair Display',Georgia,serif`;
    ctx.shadowColor=`rgba(120,210,255,${(0.95*glow)})`;ctx.shadowBlur=0.04*W;
    ctx.fillStyle="rgba(120,205,255,0.9)";ctx.fillText("2026",W/2,y2);
    ctx.shadowBlur=0.006*W;ctx.shadowColor="rgba(0,0,0,0.5)";
    ctx.fillStyle="#FFFFFF";ctx.fillText("2026",W/2,y2);ctx.restore();
  }
}

window.renderAt=function(t){if(!W)resize();drawFrame(t);return true;};
window.assetsReady=function(){return ready>=1 && document.fonts.check("700 40px 'Playfair Display'");};
resize();
</script>
</body></html>
